<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 Page Not Found</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    text-align:center;
}

.container{
    animation: fadeIn 1.5s ease-in-out;
}

h1{
    font-size:120px;
    letter-spacing:5px;
    animation: float 3s ease-in-out infinite;
}

h2{
    margin-bottom:15px;
    
}

p{
    margin-bottom:25px;
    opacity:0.8;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:25px;
    font-size:16px;
    cursor:pointer;
    background:white;
    color:#764ba2;
    font-weight:bold;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
    background:#f0f0f0;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-15px);}
}

@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
}
</style>
</head>

<body>

<div class="container">
    <h1 id="error-code">404</h1>
    <h2>🔧 We’re Working on It</h2>
    <p>Oops! The page you're looking for doesn't exist.</p>
    <button onclick="goHome()">Go Back Home</button>
</div>

<script>
function goHome(){
    window.location.href = "index.html"; // change to your homepage
}

// Small glitch effect
const error = document.getElementById("error-code");
setInterval(()=>{
    error.style.transform = "skew(" + (Math.random()*20-5) + "deg)";
    setTimeout(()=> error.style.transform="skew(0deg)",100);
},2000);
</script>

</body>
</html>
